name: Lao Lottery Analysis

on:
  schedule:
    - cron: "30 13 * * 1,3,5"   # 13:30 UTC = 20:30 เวลาไทย จันทร์/พุธ/ศุกร์
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis + backtest
        run: python main.py --data data/sample_draws.csv

      - name: Prepare GitHub Pages folder
        run: |
          mkdir -p docs
          cp output/dashboard.html docs/index.html

      - name: Commit updated reports and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ data/ docs/
          git diff --cached --quiet || git commit -m "Auto-update analysis reports and dashboard [skip ci]"
          git push

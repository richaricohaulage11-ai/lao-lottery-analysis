name: Reset Repository (DANGEROUS)

# Manual trigger ONLY — never runs on push/schedule, so it can't fire by
# accident. Deletes every file/folder at the repo root except
# .github/workflows (and other things under .github get removed too,
# e.g. ISSUE_TEMPLATE, keeping only the workflows/ subfolder).
#
# Recoverable: this is a normal git commit, not a history rewrite — the
# deleted files still exist in every commit before this one. To undo:
#   git revert <the commit this workflow made>
# or just check out any earlier commit's version of a file.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE-ALL (exactly) to confirm — this deletes everything except .github/workflows'
        required: true
        type: string

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation text
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DELETE-ALL" ]; then
            echo "::error::Confirmation text did not match 'DELETE-ALL' exactly. Aborting — nothing was deleted."
            exit 1
          fi
          echo "Confirmed. Proceeding with deletion."

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Delete everything except .github/workflows
        run: |
          set -e
          echo "Before:"
          find . -maxdepth 2 -not -path './.git*' | sort

          # Remove every top-level item except .git (the repo itself) and .github
          find . -maxdepth 1 -mindepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          # Inside .github, keep only the workflows/ subfolder
          find .github -maxdepth 1 -mindepth 1 ! -name 'workflows' -exec rm -rf {} +

          echo ""
          echo "After:"
          find . -maxdepth 2 -not -path './.git*' | sort

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to delete (repo already only has .github/workflows)."
          else
            git commit -m "Reset repo: delete everything except .github/workflows"
            git push
          fi
